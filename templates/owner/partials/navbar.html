<nav class="navbar navbar-expand-lg bg-white px-4 py-2 w-100">

            <i class="far fa-clock text-muted me-2"></i>

                class="fw-bold text-primary font-number"

            <span

            </span>

                        letter-spacing: 0.5px;
                    "
                >

                </small>

            <div class="dropdown">

                    aria-expanded="false"

                    <img
                        src="{{ url_for(
                            'static',
                            filename='uploads/profile/' + current_user.profile_image

                        alt="Profile"
                        width="42"
                        height="42"
                        class="rounded-circle border shadow-sm"
                        style="object-fit: cover;"
                    >

                    {% else %}

                    <img

                            'static',
                            filename='uploads/profile/default.png'

                    <li class="px-3 py-2">

                        <div class="d-flex align-items-center gap-3">

                                class="rounded-circle border"
                                style="object-fit: cover;"

                            {% else %}

                            <img
                                src="{{ url_for(
                                    'static',
                                    filename='uploads/profile/default.png'
                                ) }}"

                                width="48"
                                height="48"
                                class="rounded-circle border"

                    <li>

                    <li>

                    <li>

                            Keluar

                        </a>

                    </li>

                </ul>
