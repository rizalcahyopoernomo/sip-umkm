<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        {% block title %}
            SIP-UMKM | System
        {% endblock %}

    </title>

    <link
     rel="shortcut icon"
     type="image/x-icon"
     sizes="32x32"
     href="{{ url_for('static', filename='favicon.ico') }}"
    >
    <link
     rel="icon"
        type="image/png"
        sizes="32x32"
        href="{{ url_for('static', filename='favicon.ico') }}"
    >


    <!-- =========================
         FONT AWESOME
    ========================== -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    >

    <!-- =========================
         BOOTSTRAP
    ========================== -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- =========================
         UTILITIES CSS
    ========================== -->
    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/utilities.css'
        ) }}"
    >

    {% block head %}
    {% endblock %}

    <style>

        /* =========================
           BASE LAYOUT
        ========================== */

        body {

            margin: 0;

            padding: 0;

            overflow-x: hidden;

            background-color: #f3f6ff;
        }


        /* =========================
           TOAST CONTAINER
        ========================== */

        .toast-container-custom {

            position: fixed;

            top: 20px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 9999;

            width: 100%;

            max-width: 420px;

            pointer-events: none;
        }


        /* =========================
           CUSTOM ALERT
        ========================== */

        .custom-alert {

            pointer-events: auto;

            display: flex;

            align-items: center;

            gap: 14px;

            padding: 16px 20px;

            margin-bottom: 12px;

            border-radius: 16px;

            background:
                rgba(255, 255, 255, 0.96);

            backdrop-filter: blur(12px);

            box-shadow:
                0 12px 30px rgba(0,0,0,0.10);

            animation:
                slideDown 0.4s ease;

            border-left:
                5px solid #d1d5db;
        }


        /* =========================
           ALERT TYPE
        ========================== */

        .alert-success {

            border-left-color: #16a34a;
        }

        .alert-danger {

            border-left-color: #dc2626;
        }

        .alert-warning {

            border-left-color: #f59e0b;
        }

        .alert-info {

            border-left-color: #2563eb;
        }


        /* =========================
           ALERT ICON
        ========================== */

        .alert-icon {

            font-size: 18px;
        }

        .alert-success .alert-icon {

            color: #16a34a;
        }

        .alert-danger .alert-icon {

            color: #dc2626;
        }

        .alert-warning .alert-icon {

            color: #f59e0b;
        }

        .alert-info .alert-icon {

            color: #2563eb;
        }


        /* =========================
           ALERT MESSAGE
        ========================== */

        .alert-message {

            flex: 1;

            font-size: 14px;

            font-weight: 500;

            color: #111827;
        }


        /* =========================
           CLOSE BUTTON
        ========================== */

        .btn-close-custom {

            border: none;

            background: transparent;

            color: #9ca3af;

            font-size: 18px;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .btn-close-custom:hover {

            color: #111827;
        }


        /* =========================
           ANIMATION
        ========================== */

        @keyframes slideDown {

            from {

                opacity: 0;

                transform: translateY(-15px);
            }

            to {

                opacity: 1;

                transform: translateY(0);
            }
        }


        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 576px) {

            .toast-container-custom {

                width: calc(100% - 24px);
            }

            .custom-alert {

                padding: 14px 16px;
            }

            .alert-message {

                font-size: 13px;
            }
        }

    </style>

</head>

<body>

    <!-- =========================
         FLASH MESSAGE
    ========================== -->

    <div class="toast-container-custom">

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="custom-alert alert-{{ category }}">

                        <!-- ICON -->
                        <div class="alert-icon">

                            <i class="fas

                                {% if category == 'danger' %}
                                    fa-circle-exclamation

                                {% elif category == 'success' %}
                                    fa-circle-check

                                {% elif category == 'warning' %}
                                    fa-triangle-exclamation

                                {% else %}
                                    fa-circle-info
                                {% endif %}
                            "></i>

                        </div>

                        <!-- MESSAGE -->
                        <div class="alert-message">

                            {{ message }}

                        </div>

                        <!-- CLOSE -->
                        <button
                            class="btn-close-custom"
                            onclick="this.parentElement.remove()"
                        >

                            &times;

                        </button>

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}

    </div>


    <!-- =========================
         PAGE CONTENT
    ========================== -->

    {% block content %}
    {% endblock %}


    <!-- =========================
         BOOTSTRAP JS
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    ></script>


    {% block scripts %}
    {% endblock %}

</body>

</html>
